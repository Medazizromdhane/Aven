# Render.com Blueprint — free API + frontend deployment.
# Import via Render → New → Blueprint, pointing at this repo.
services:
  - type: web
    name: aven-api
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: pnpm install --prod=false && pnpm prisma:generate && pnpm build && pnpm prisma:push
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_SMALL_MODEL
        value: openai/gpt-oss-120b
      # ---- Job aggregation ----
      # RapidAPI JSearch aggregates Google for Jobs (LinkedIn, Indeed, Glassdoor…).
      # Free plan: https://rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch
      - key: RAPIDAPI_KEY
        sync: false
      # Adzuna free tier: https://developer.adzuna.com/
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      # Optional: broaden the keyless boards (comma-separated tokens/companies).
      - key: GREENHOUSE_BOARDS
        sync: false
      - key: LEVER_COMPANIES
        sync: false
      - key: STORAGE_ENDPOINT
        value: https://euglifuvnukxrodjdder.supabase.co/storage/v1/s3
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: visahunter
      # Supabase signs S3 requests against the project's real region — set this to
      # the region shown under Storage → S3 access (e.g. eu-central-1). "auto"
      # only works for Cloudflare R2 and will fail Supabase uploads.
      - key: STORAGE_REGION
        sync: false
      - key: JOBS_CRON_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: WEB_URL
        fromService:
          type: web
          name: aven-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: aven-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: pnpm install --prod=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aven-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
