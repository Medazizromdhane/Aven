name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @visahunter/backend prisma:generate

      - name: Build backend
        run: pnpm --filter @visahunter/backend build

      - name: Test backend
        run: pnpm --filter @visahunter/backend test

      - name: Build web
        run: pnpm --filter @visahunter/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
